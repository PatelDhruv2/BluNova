worker_processes auto;

events {
    worker_connections 4096;
}

# ================= RTMP CONFIG =================
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # -------- HLS (LOW LATENCY LIVE) --------
            hls on;
            hls_path /var/www/hls;
            hls_fragment 2;
            hls_playlist_length 6;
            hls_cleanup on;

            # ❌ REMOVE DVR BEHAVIOR (IMPORTANT)
            hls_continuous off;

            # -------- DASH (OPTIONAL) --------
            dash on;
            dash_path /var/www/dash;
        }
    }
}

# ================= HTTP CONFIG =================
http {
    sendfile off;
    tcp_nopush on;
    directio 512;
    default_type application/octet-stream;

    server {
        listen 8090;

        # -------- HLS SERVE --------
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/www;
            add_header Cache-Control no-store;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
        }

        # -------- DASH SERVE --------
        location /dash {
            types {
                application/dash+xml mpd;
            }
            root /var/www;
            add_header Cache-Control no-store;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
        }

        # -------- RTMP STATS --------
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /var/www/html;
        }
    }
}
